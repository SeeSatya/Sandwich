    rel="stylesheet">
  <style>
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    /* Print Specifics */
    @media print {
      @page {
        /* No browser margin - full bleed background */
        margin: 0;
        size: A4;
      }

      /* Force color printing for all elements */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }

      /* Body inherits theme background from #print-area */
      body {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Hide UI elements */
      .print\:hidden {
        display: none !important;
      }

      /* Layout Reset - everything transparent */
      #root,
      #root>div,
      main {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
      }

      /* Paper Container - Full page with theme background */
      #print-area {
        width: 100% !important;
        max-width: none !important;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        min-height: 100vh !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Inner wrapper fills all available space */
      #print-area>div {
        min-height: 100vh !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Page Counter Logic */
      body {
        counter-reset: page;
      }

      .print-page-number::after {
        counter-increment: page;
        content: "Page " counter(page);
      }

      /* Improved Break handling - prevent content from breaking across pages */
      pre,
      blockquote,
      img,
      .code-block-wrapper,
      figure,
      .mermaid-container {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      h1,
      h2,
      h3,
      h4,
      h5 {
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }

      /* Table specific fixes */
      table {
        page-break-inside: auto;
      }

      tr {
        page-break-inside: avoid;
        page-break-after: auto;
      }

      thead {
        display: table-header-group;
      }

      tfoot {
        display: table-footer-group;
      }
    }

    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
